name: Shopee Export to Google Sheets (Daily)

on:
  schedule:
    # 매일 한국시간 오전 9시 실행
    - cron: "0 0 * * *"
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Shopee session
        run: |
          echo "${{ secrets.SHOPEE_SESSION_JSON }}" > shopee_session.json

      - name: Restore Google Service Account
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > service_account.json

      - name: Run Shopee export script
        run: |
          python shopee_export_to_sheets.py
